name: CI & Cloudflare Pages Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Typecheck, Test & Build Offline PWA
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit & round-trip tests
        run: npm test

      - name: Build production offline PWA
        run: npm run build

      - name: Upload Web PWA bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: BridgeAAC-web-pwa
          path: dist/
          retention-days: 14

      - name: Deploy to Cloudflare Pages (if API token configured)
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler pages deploy dist --project-name="${{ vars.CLOUDFLARE_PROJECT_NAME || 'bridgeaac' }}" --branch="${{ github.ref_name }}"
