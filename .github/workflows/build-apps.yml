name: Build Desktop & Android Apps

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: BridgeAAC-Linux
          - os: windows-latest
            platform: win
            artifact_name: BridgeAAC-Windows
          - os: macos-latest
            platform: mac
            artifact_name: BridgeAAC-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Install Electron & Electron Builder
        run: npm install --no-save --legacy-peer-deps electron@35.0.0 electron-builder@26.0.12

      - name: Build Web Bundle & Package Desktop App
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build
          npx electron-builder --${{ matrix.platform }} --config electron-builder.json --publish never

      - name: Upload Desktop Installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
          if-no-files-found: warn

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Preinstalled Android SDK & Accept Licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor Android tooling
        run: npm install --no-save --legacy-peer-deps @capacitor/core@8.0.0 @capacitor/cli@8.0.0 @capacitor/android@8.0.0

      - name: Build Web Bundle & Sync Capacitor Android
        run: |
          npm run build
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          sed -i -E 's/(compileSdkVersion|targetSdkVersion) = [0-9]+/\1 = 36/' android/variables.gradle
          grep -E "compileSdkVersion|targetSdkVersion" android/variables.gradle
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Android APK & Google Play App Bundle (AAB) with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../BridgeAAC-android.apk
          cp app/build/outputs/bundle/release/app-release.aab ../BridgeAAC-android.aab || true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: BridgeAAC-Android
          path: BridgeAAC-android.apk
          if-no-files-found: warn

      - name: Upload Private Google Play AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: BridgeAAC-GooglePlay-AAB
          path: BridgeAAC-android.aab
          if-no-files-found: warn

  build-ios-swift:
    name: Build Swift Package (iOS & macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Web Bundle & Verify Swift Package
        run: |
          npm run ios:sync
          swift build

  publish-release:
    name: Publish GitHub Release Downloads
    needs: [build-desktop, build-android, build-ios-swift]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built app artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Filter public release assets
        run: |
          rm -f release-assets/*.aab

      - name: Prune previous release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_TAG="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}"
          EXISTING_ASSETS=$(gh release view "$TARGET_TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
          for asset in $EXISTING_ASSETS; do
            if [ "$TARGET_TAG" = "latest" ] || [ ! -f "release-assets/$asset" ]; then
              gh release delete-asset "$TARGET_TAG" "$asset" --yes 2>/dev/null || true
            fi
          done

      - name: Publish or Update GitHub Release with App Downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('BridgeAAC {0}', github.ref_name) || 'BridgeAAC Latest Builds (Windows, Linux, macOS & Android)' }}
          body: ${{ startsWith(github.ref, 'refs/tags/v') && '' || format('Continuous build updated from commit {0}. All platform binaries are refreshed automatically on every update.', github.sha) }}
          make_latest: true
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.apk
