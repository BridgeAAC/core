name: Build Desktop & Android Apps

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: BridgeAAC-Linux
          - os: windows-latest
            platform: win
            artifact_name: BridgeAAC-Windows
          - os: macos-latest
            platform: mac
            artifact_name: BridgeAAC-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Install Electron & Electron Builder
        run: npm install --no-save --legacy-peer-deps electron@35.0.0 electron-builder@26.0.12

      - name: Build Web Bundle & Package Desktop App
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build
          npx electron-builder --${{ matrix.platform }} --config electron-builder.json --publish never

      - name: Upload Desktop Installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
          if-no-files-found: warn

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor Android tooling
        run: npm install --no-save --legacy-peer-deps @capacitor/core@7.0.0 @capacitor/cli@7.0.0 @capacitor/android@7.0.0

      - name: Build Web Bundle & Sync Capacitor Android
        run: |
          npm run build
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../BridgeAAC-android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: BridgeAAC-Android
          path: BridgeAAC-android.apk
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub Release Downloads
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all built app artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish or Update GitHub Release with App Downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('BridgeAAC {0}', github.ref_name) || 'BridgeAAC Latest Builds (Windows, Linux, macOS & Android)' }}
          make_latest: true
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.apk
