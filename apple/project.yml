name: BridgeAAC
options:
  bundleIdPrefix: org.bridgeaac
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  BridgeAAC:
    type: application
    platform: iOS
    sources:
      - path: ../Sources/BridgeAAC/BridgeAACApp.swift
      - path: ../Sources/BridgeAAC/ContentView.swift
      - path: ../Sources/BridgeAAC/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../Sources/BridgeAAC/Resources/WebBundle
        type: folder
        buildPhase: resources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: BridgeAAC
        PRODUCT_BUNDLE_IDENTIFIER: org.bridgeaac.app
        INFOPLIST_FILE: ../Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ../BridgeAAC.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
